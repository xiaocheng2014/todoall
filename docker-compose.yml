services:
  migrate:
    build: .
    command: npm run db:deploy
    env_file: .env
    volumes:
      - todoall_data:/app/data
    restart: "no"

  web:
    build: .
    command: npm start
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - todoall_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: npm run worker
    env_file: .env
    volumes:
      - todoall_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  todoall_data:
